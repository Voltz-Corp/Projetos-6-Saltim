services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saltim
      POSTGRES_PASSWORD: saltim123
      POSTGRES_DB: saltim_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/data:ro
      - ./data/ml_dataset/outputs:/ml_dataset_outputs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saltim -d saltim_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: ./mlflow
    depends_on:
      db:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://saltim:saltim123@db:5432/saltim_db
      MLFLOW_ARTIFACTS_DESTINATION: /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command:
      [
        "mlflow",
        "server",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
        "--backend-store-uri",
        "postgresql+psycopg2://saltim:saltim123@db:5432/saltim_db",
        "--serve-artifacts",
        "--artifacts-destination",
        "/mlflow/artifacts",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  mlflow_artifacts:
